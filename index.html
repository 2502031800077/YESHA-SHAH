<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Application</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 800px;
      margin: 50px auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h1 {
      margin-bottom: 15px;
    }

    p {
      margin-bottom: 25px;
      color: #555;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #1d4ed8;
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
      color: #16a34a;
    }
  </style>
</head>

<body>

  <header>
    <h2>My Application</h2>
  </header>

  <main>
    <h1>Welcome!</h1>

    <p>
      This is my application created using HTML, CSS and JavaScript.
    </p>

    <button onclick="startApp()">Start Application</button>

    <div id="message"></div>
  </main>

  <script>
    function startApp() {
      document.getElementById("message").textContent =
        "Application started successfully!";
    }
  </script>

</body>
</html>
